<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stencil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Camera feed */
  #camera {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }

  /* Overlay stencil image */
  #stage {
    position: fixed; inset: 0;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    top: 50%; left: 50%;
    max-width: 85vw;
    max-height: 70vh;
    will-change: transform, opacity;
    pointer-events: none;
    filter: drop-shadow(0 0 1px rgba(0,0,0,0.4));
  }

  /* Camera permission screen */
  #gate {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    background: #000;
    color: #ddd;
    text-align: center;
    padding: 32px;
    z-index: 50;
  }
  #gate p { font-size: 15px; line-height: 1.5; color: #999; max-width: 300px; }
  #gate button {
    font-size: 17px; font-weight: 600;
    color: #000; background: #fff;
    border: none; border-radius: 14px;
    padding: 14px 28px;
  }
  #gate .err { color: #e66; font-size: 13px; }
  .hidden { display: none !important; }

  /* Control bar */
  #controls {
    position: fixed;
    left: 12px; right: 12px;
    bottom: calc(10px + env(safe-area-inset-bottom));
    background: rgba(24,24,24,0.72);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 14px 18px 12px;
    z-index: 40;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  #controls.collapsed {
    transform: translateY(calc(100% + 20px));
    opacity: 0;
    pointer-events: none;
  }

  .slider-row {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px;
  }
  .slider-row span { color: #aaa; font-size: 12px; min-width: 34px; }
  input[type=range] {
    flex: 1;
    appearance: none; -webkit-appearance: none;
    height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.25);
    touch-action: pan-x;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fff;
    border: none;
  }

  .btn-row {
    display: flex; justify-content: space-around; gap: 8px;
  }
  .btn-row button {
    flex: 1;
    background: none; border: none;
    color: #fff; font-size: 12px;
    display: flex; flex-direction: column;
    align-items: center; gap: 5px;
    padding: 6px 0;
  }
  .btn-row button:disabled { color: #666; }
  .btn-row button:disabled svg { opacity: 0.4; }
  .btn-row svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn-row button.active { color: #7fd4ff; }

  /* Toggle tab to show/hide controls */
  #tab {
    position: fixed;
    right: 14px;
    top: calc(14px + env(safe-area-inset-top));
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(24,24,24,0.6);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    z-index: 41;
  }
  #tab svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

  #fileInput { display: none; }
</style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>

<div id="stage">
  <img id="overlay" class="hidden" alt="">
</div>

<div id="gate">
  <p>Live camera as background, your photo on top as a tracing stencil.</p>
  <button id="startBtn">Enable camera</button>
  <p class="err hidden" id="gateErr"></p>
</div>

<button id="tab" class="hidden" aria-label="Toggle controls">
  <svg viewBox="0 0 24 24"><path d="M4 12h16M4 6h16M4 18h16"/></svg>
</button>

<div id="controls" class="hidden">
  <div class="slider-row">
    <span>Opacity</span>
    <input type="range" id="opacity" min="5" max="100" value="50">
  </div>
  <div class="btn-row">
    <button id="photoBtn">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      Photo
    </button>
    <button id="flipBtn" disabled>
      <svg viewBox="0 0 24 24"><path d="M12 3v18M8 7L4 12l4 5M16 7l4 5-4 5"/></svg>
      Flip
    </button>
    <button id="resetBtn" disabled>
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
      Reset
    </button>
    <button id="clearBtn" disabled>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
      Clear
    </button>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*">

<script>
(function () {
  const video = document.getElementById('camera');
  const overlay = document.getElementById('overlay');
  const stage = document.getElementById('stage');
  const gate = document.getElementById('gate');
  const gateErr = document.getElementById('gateErr');
  const startBtn = document.getElementById('startBtn');
  const controls = document.getElementById('controls');
  const tab = document.getElementById('tab');
  const fileInput = document.getElementById('fileInput');
  const opacitySlider = document.getElementById('opacity');
  const photoBtn = document.getElementById('photoBtn');
  const flipBtn = document.getElementById('flipBtn');
  const resetBtn = document.getElementById('resetBtn');
  const clearBtn = document.getElementById('clearBtn');

  // ---------- Camera ----------
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      });
      video.srcObject = stream;
      gate.classList.add('hidden');
      controls.classList.remove('hidden');
      tab.classList.remove('hidden');
      requestWakeLock();
    } catch (e) {
      gateErr.textContent = 'Camera failed: ' + e.name +
        '. This page must be opened over HTTPS in Safari, and camera access must be allowed.';
      gateErr.classList.remove('hidden');
    }
  }
  startBtn.addEventListener('click', startCamera);

  // ---------- Wake lock (keep screen on) ----------
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (e) { /* not critical */ }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !gate.classList.contains('hidden') === false) {
      requestWakeLock();
    }
  });

  // ---------- Overlay state ----------
  let tx = 0, ty = 0;        // translation
  let scale = 1;
  let rot = 0;               // radians
  let flipped = false;
  let hasImage = false;

  function applyTransform() {
    overlay.style.transform =
      'translate(-50%, -50%) ' +
      'translate(' + tx + 'px, ' + ty + 'px) ' +
      'rotate(' + rot + 'rad) ' +
      'scale(' + scale + ') ' +
      'scaleX(' + (flipped ? -1 : 1) + ')';
  }

  function resetTransform() {
    tx = 0; ty = 0; scale = 1; rot = 0;
    applyTransform();
  }

  function setButtons(enabled) {
    flipBtn.disabled = !enabled;
    resetBtn.disabled = !enabled;
    clearBtn.disabled = !enabled;
  }

  // ---------- Photo loading ----------
  photoBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    overlay.onload = () => URL.revokeObjectURL(url);
    overlay.src = url;
    overlay.classList.remove('hidden');
    hasImage = true;
    flipped = false;
    resetTransform();
    setButtons(true);
  });

  // ---------- Buttons ----------
  flipBtn.addEventListener('click', () => {
    flipped = !flipped;
    flipBtn.classList.toggle('active', flipped);
    applyTransform();
  });
  resetBtn.addEventListener('click', () => {
    flipped = false;
    flipBtn.classList.remove('active');
    resetTransform();
  });
  clearBtn.addEventListener('click', () => {
    overlay.src = '';
    overlay.classList.add('hidden');
    hasImage = false;
    flipped = false;
    flipBtn.classList.remove('active');
    fileInput.value = '';
    setButtons(false);
  });
  tab.addEventListener('click', () => controls.classList.toggle('collapsed'));

  // ---------- Opacity ----------
  function setOpacity() {
    overlay.style.opacity = opacitySlider.value / 100;
  }
  opacitySlider.addEventListener('input', setOpacity);
  setOpacity();

  // ---------- Gestures on the stage ----------
  // 1 finger: drag. 2 fingers: pinch to scale + rotate + move (midpoint).
  let startTouches = null;
  let startState = null;

  function touchInfo(touches) {
    if (touches.length === 1) {
      return { x: touches[0].clientX, y: touches[0].clientY };
    }
    const dx = touches[1].clientX - touches[0].clientX;
    const dy = touches[1].clientY - touches[0].clientY;
    return {
      x: (touches[0].clientX + touches[1].clientX) / 2,
      y: (touches[0].clientY + touches[1].clientY) / 2,
      dist: Math.hypot(dx, dy),
      angle: Math.atan2(dy, dx)
    };
  }

  function anchor(touches) {
    startTouches = touchInfo(touches);
    startTouches.count = touches.length;
    startState = { tx: tx, ty: ty, scale: scale, rot: rot };
  }

  stage.addEventListener('touchstart', (e) => {
    if (!hasImage) return;
    e.preventDefault();
    anchor(e.touches);
  }, { passive: false });

  stage.addEventListener('touchmove', (e) => {
    if (!hasImage || !startTouches) return;
    e.preventDefault();
    // If the number of fingers changed since anchor, re-anchor
    if (e.touches.length !== startTouches.count) {
      anchor(e.touches);
      return;
    }
    const now = touchInfo(e.touches);

    tx = startState.tx + (now.x - startTouches.x);
    ty = startState.ty + (now.y - startTouches.y);

    if (e.touches.length >= 2) {
      const s = startState.scale * (now.dist / startTouches.dist);
      scale = Math.min(Math.max(s, 0.1), 20);
      rot = startState.rot + (now.angle - startTouches.angle);
    }
    applyTransform();
  }, { passive: false });

  stage.addEventListener('touchend', (e) => {
    if (!hasImage) return;
    if (e.touches.length > 0) {
      anchor(e.touches);
    } else {
      startTouches = null;
      startState = null;
    }
  });

  // Block iOS double-tap zoom on the page
  document.addEventListener('dblclick', (e) => e.preventDefault());
})();
</script>
</body>
</html>
