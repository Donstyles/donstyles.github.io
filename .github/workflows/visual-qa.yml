name: Alpine Scenic Gaze Search

on:
  push:
    branches: [main]

concurrency:
  group: alpine-gaze-search
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Start server
        run: |
          python -m http.server 8000 >/tmp/alpine-server.log 2>&1 &
          sleep 2
      - name: Capture scenic gaze candidates
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageStat
          from pathlib import Path
          import json
          shots=[
            ('A_diag_p25',-246,-1750,5.55,.25),
            ('A_diag_p30',-246,-1750,5.55,.30),
            ('A_forward_p28',-246,-1750,0.0,.28),
            ('A_back_p28',-246,-1750,3.142,.28),
            ('A_left_p28',-246,-1750,4.712,.28),
            ('A_right_p28',-246,-1750,1.571,.28),
            ('B_diag_p28',-572,-3000,.38,.28),
            ('C_forward_p28',212,0,0.0,.28),
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True); metrics=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox'])
            page=browser.new_page(viewport={'width':932,'height':430})
            for name,x,z,yaw,pitch in shots:
              page.goto(f'http://127.0.0.1:8000/index.html?qa=1&x={x}&z={z}&yaw={yaw}&pitch={pitch}',wait_until='load',timeout=30000); page.wait_for_timeout(1600)
              target=out/f'{name}.png'; page.screenshot(path=str(target))
              im=Image.open(target).convert('L'); hist=im.histogram(); total=sum(hist); mean=ImageStat.Stat(im).mean[0]; lo,hi=im.getextrema(); near=sum(hist[:18])/total
              metrics.append({'name':name,'mean':mean,'near_black':near,'range':hi-lo}); print(name,round(mean,1),round(near,4),hi-lo)
            browser.close()
          (out/'metrics.json').write_text(json.dumps(metrics,indent=2))
          PY
      - name: Upload gaze search
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpine-scenic-gaze-search
          path: qa-shots/*
          if-no-files-found: error
