name: Alpine Visual QA

on:
  push:
    branches: [main]

concurrency:
  group: alpine-visual-qa
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  visual-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build scan-selected valley candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import math,re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r"let pos=\{x:[^,]+,z:[^}]+\}, yaw=[^,]+,pitch=[^,]+, bob=",
                   "let pos={x:2500,z:2500}, yaw=2.16,pitch=-.025, bob=", s, count=1)
          if 'let pos={x:2500,z:2500}, yaw=2.16' not in s:
              raise SystemExit('Spawn patch failed')
          p.write_text(s)

          def fract(x): return x-math.floor(x)
          def hsh(x,z): return fract(math.sin(x*127.1+z*311.7)*43758.5453123)
          def noise(x,z):
              ix,iz=math.floor(x),math.floor(z); fx,fz=fract(x),fract(z)
              ux,uz=fx*fx*(3-2*fx),fz*fz*(3-2*fz)
              a,b,c,d=hsh(ix,iz),hsh(ix+1,iz),hsh(ix,iz+1),hsh(ix+1,iz+1)
              return ((a*(1-ux)+b*ux)*(1-uz)+(c*(1-ux)+d*ux)*uz)
          def terrain(x,z):
              macro=noise(x*.00012+11,z*.00012-7)
              r0=1-abs(noise(x*.00028-21,z*.00028+31)*2-1)
              r1=1-abs(noise(x*.00055+47,z*.00055-13)*2-1)
              shoulder=noise(x*.00110-5,z*.00110+17)
              detail=noise(x*.0028+9,z*.0028-29)
              mountains=(r0**2.7)*(1050+1050*macro)+(r1**3.0)*360
              return 430+macro*300+mountains+shoulder*110+detail*18
          x=z=2500.0; eye=terrain(x,z)+1.72
          radii=(250,500,750,1000,1500,2000,3000,4000,5000)
          max_near=max_all=max_far=-90
          for i in range(32):
              a=i*2*math.pi/32
              for r in radii:
                  hh=terrain(x+math.sin(a)*r,z+math.cos(a)*r)
                  e=math.degrees(math.atan2(hh-eye,r))
                  max_all=max(max_all,e)
                  if r<=1000: max_near=max(max_near,e)
                  if r>=3000: max_far=max(max_far,e)
          print('skyline near/all/far',round(max_near,2),round(max_all,2),round(max_far,2))
          if max_near>3.0 or max_all>17.0 or max_far<8.0:
              raise SystemExit('Spawn skyline rejected')
          PY

      - name: Install browser QA
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start local server
        run: |
          python -m http.server 8000 >/tmp/alpine-server.log 2>&1 &
          sleep 2

      - name: Capture 360-degree iPhone stress views
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageStat
          from pathlib import Path
          import json
          shots=[
            ('spawn_peak',2500,2500,2.16,-.025,True),
            ('north',2500,2500,0.0,-.025,True),
            ('east',2500,2500,1.57,-.025,True),
            ('south',2500,2500,3.14,-.025,True),
            ('west',2500,2500,4.71,-.025,True),
            ('northwest',2500,2500,5.50,-.025,True),
            ('look_up',2500,2500,2.16,.34,False),
            ('look_down',2500,2500,2.16,-.34,False),
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True)
          metrics=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox'])
            page=browser.new_page(viewport={'width':932,'height':430})
            for name,x,z,yaw,pitch,normal in shots:
              page.goto(f'http://127.0.0.1:8000/index.html?qa=1&x={x}&z={z}&yaw={yaw}&pitch={pitch}',wait_until='load',timeout=30000)
              page.wait_for_timeout(1800)
              if not page.evaluate("!!document.querySelector('#game').getContext('webgl2')"):
                  raise RuntimeError('WebGL2 unavailable')
              target=out/f'{name}.png'; page.screenshot(path=str(target))
              im=Image.open(target).convert('L'); hist=im.histogram(); total=sum(hist)
              mean=ImageStat.Stat(im).mean[0]; black=sum(hist[:18])/total; lo,hi=im.getextrema()
              x0=int(im.width*.20); x1=int(im.width*.80); y1=int(im.height*.16)
              top=im.crop((x0,0,x1,y1))
              top_std=ImageStat.Stat(top).stddev[0]
              row={'name':name,'mean':mean,'black':black,'range':hi-lo,'top_std':top_std,'normal':normal}
              metrics.append(row)
              print(name,'mean',round(mean,1),'black',round(black,4),'range',hi-lo,'center_top_std',round(top_std,1))
            browser.close()
          Path('qa-metrics.json').write_text(json.dumps(metrics,indent=2))
          PY

      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: alpine-visual-qa-scan-valley
          path: |
            qa-shots/*.png
            qa-metrics.json
          if-no-files-found: error

      - name: Evaluate visual guardrails
        run: |
          python - <<'PY'
          import json
          m=json.load(open('qa-metrics.json'))
          bad=[x for x in m if x['mean']<50 or x['black']>.06 or x['range']<65 or (x['normal'] and x['top_std']>9.0)]
          if bad:
              raise SystemExit('Visual guardrail failed after evidence upload: '+repr(bad))
          PY

      - name: Commit candidate to QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No QA code changes"
          else
            git commit -m "QA: use 360-degree scan-selected valley spawn"
            git pull --rebase origin qa
            git push origin HEAD:qa
          fi
