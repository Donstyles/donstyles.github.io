name: Alpine Latest QA Review

on:
  push:
    branches: [main]

concurrency:
  group: alpine-latest-review
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser QA
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start candidate server
        run: |
          python -m http.server 8000 >/tmp/alpine-server.log 2>&1 &
          sleep 2

      - name: Capture latest QA on iPhone viewport
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageStat
          from pathlib import Path
          import json,re

          shots=[
            ('spawn',None,None,None,None),
            ('left',None,None,4.712,-.035),
            ('right',None,None,1.571,-.035),
            ('back',None,None,3.142,-.035),
            ('look_up',None,None,None,.42),
            ('look_down',None,None,None,-.42),
            ('walk_700',None,700,None,None),
            ('ridge_edge',1100,1100,.55,-.04),
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True)
          metrics=[]; errors=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox'])
            context=browser.new_context(viewport={'width':932,'height':430},has_touch=True,is_mobile=True,device_scale_factor=1)
            page=context.new_page()
            page.on('pageerror', lambda exc: errors.append('pageerror: '+str(exc)))
            page.on('console', lambda msg: errors.append('console error: '+msg.text) if msg.type=='error' else None)
            for name,x,z,yaw,pitch in shots:
              qs=['qa=1']
              if x is not None: qs.append(f'x={x}')
              if z is not None: qs.append(f'z={z}')
              if yaw is not None: qs.append(f'yaw={yaw}')
              if pitch is not None: qs.append(f'pitch={pitch}')
              page.goto('http://127.0.0.1:8000/index.html?'+'&'.join(qs),wait_until='load',timeout=30000)
              page.wait_for_timeout(1700)
              if not page.evaluate("!!document.querySelector('#game').getContext('webgl2')"):
                errors.append(name+': WebGL2 unavailable'); continue
              target=out/f'{name}.png'; page.screenshot(path=str(target))
              im=Image.open(target).convert('L'); hist=im.histogram(); total=sum(hist)
              mean=ImageStat.Stat(im).mean[0]; near_black=sum(hist[:18])/total; lo,hi=im.getextrema()
              top=im.crop((170,0,762,120)); th=top.histogram(); tt=sum(th); top_dark=sum(th[:38])/tt
              metrics.append({'name':name,'mean':mean,'near_black':near_black,'range':hi-lo,'top_dark':top_dark})
              print(name,'mean',round(mean,1),'black',round(near_black,4),'range',hi-lo,'top_dark',round(top_dark,3))

            page.goto('http://127.0.0.1:8000/index.html',wait_until='load',timeout=30000); page.wait_for_timeout(700)
            if not page.is_visible('#enter'): errors.append('Entry screen missing')
            else:
              page.click('#enter'); page.wait_for_timeout(300); page.keyboard.press('Backquote'); page.wait_for_timeout(150)
              before=page.locator('#debug').inner_text(); page.keyboard.down('KeyW'); page.wait_for_timeout(900); page.keyboard.up('KeyW'); page.wait_for_timeout(150); after=page.locator('#debug').inner_text()
              def coords(text):
                m=re.search(r'(-?\d+)m\s+(-?\d+)m',text); return (int(m.group(1)),int(m.group(2))) if m else None
              if not coords(before) or coords(before)==coords(after): errors.append('Walking input failed')
            browser.close()
          (out/'metrics.json').write_text(json.dumps({'metrics':metrics,'errors':errors},indent=2))
          PY

      - name: Upload latest QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpine-latest-qa-review
          path: qa-shots/*
          if-no-files-found: error
