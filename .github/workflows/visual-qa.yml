name: Alpine Visual QA

on:
  push:
    branches: [main]

concurrency:
  group: alpine-visual-qa
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  visual-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build scenic QA candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # Start in an open low valley looking toward a distant ~2.4 km ridge.
          s=s.replace("let pos={x:0,z:0}, yaw=5.323,pitch=-.04", "let pos={x:3750,z:5750}, yaw=.262,pitch=-.035")

          # Preserve endless forest while stopping nearby billboards from dominating the landscape.
          s=s.replace("const cell=34, r=1050", "const cell=38, r=1120")
          s=s.replace("forest>.42 && localSlope<16", "forest>.50 && localSlope<16")
          s=s.replace("const s=(5.2+hash2(gx+7,gz+11)*6.8)", "const s=(4.8+hash2(gx+7,gz+11)*5.7)")

          # Stormy overcast, but never a near-black ceiling.
          s=s.replace("vec3 zen=vec3(.115,.132,.130), hor=vec3(.385,.400,.388);", "vec3 zen=vec3(.145,.162,.160), hor=vec3(.405,.418,.406);")
          s=s.replace("vec3(.190,.208,.202),cloud*.38", "vec3(.220,.235,.228),cloud*.30")
          s=s.replace("vec3 fogCol=vec3(.300,.320,.306)", "vec3 fogCol=vec3(.315,.330,.318)")
          s=s.replace("col=mix(col,vec3(.300,.320,.306),clamp(fog,0.0,.98));", "col=mix(col,vec3(.315,.330,.318),clamp(fog,0.0,.98));")
          s=s.replace("opacity:.36;", "opacity:.30;", 1)

          required=[
            "let pos={x:3750,z:5750}, yaw=.262,pitch=-.035",
            "const cell=38, r=1120",
            "forest>.50 && localSlope<16",
            "vec3 zen=vec3(.145,.162,.160)",
            "gl.clear(gl.DEPTH_BUFFER_BIT)",
            "gl.uniform3f(uni(treeP,'uUp'),0,1,0)"
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('QA patch missing: '+repr(missing))
          p.write_text(s)
          PY

      - name: Install browser QA
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start local server
        run: |
          python -m http.server 8000 >/tmp/alpine-server.log 2>&1 &
          sleep 2

      - name: Capture iPhone gameplay views
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageStat
          from pathlib import Path

          shots=[
            ('spawn',3750,5750,.262,-.035),
            ('spawn_left',3750,5750,5.55,-.035),
            ('spawn_right',3750,5750,1.15,-.035),
            ('distant_peak',7750,2500,-.262,-.04),
            ('forest_edge',4500,7000,1.13,-.03),
            ('pitch_up',3750,5750,.262,.42),
            ('pitch_down',3750,5750,.262,-.42),
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True)
          metrics=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox'])
            page=browser.new_page(viewport={'width':932,'height':430})
            for name,x,z,yaw,pitch in shots:
              page.goto(f'http://127.0.0.1:8000/index.html?qa=1&x={x}&z={z}&yaw={yaw}&pitch={pitch}',wait_until='load',timeout=30000)
              page.wait_for_timeout(1800)
              if not page.evaluate("!!document.querySelector('#game').getContext('webgl2')"):
                raise RuntimeError('WebGL2 unavailable')
              target=out/f'{name}.png'; page.screenshot(path=str(target))
              im=Image.open(target).convert('L'); hist=im.histogram(); total=sum(hist)
              mean=ImageStat.Stat(im).mean[0]; near_black=sum(hist[:18])/total; lo,hi=im.getextrema()
              metrics.append((name,mean,near_black,hi-lo))
              print(name,'mean',round(mean,1),'near_black',round(near_black,4),'range',hi-lo)
            browser.close()
          bad=[m for m in metrics if m[1] < 48 or m[2] > .08 or m[3] < 65]
          if bad: raise SystemExit('Visual readability guardrail failed: '+repr(bad))
          PY

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-visual-qa-scenic
          path: qa-shots/*.png
          if-no-files-found: error

      - name: Commit candidate to QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No QA code changes"
          else
            git commit -m "QA: scenic valley spawn and balanced tree scale"
            git push origin HEAD:qa
          fi
