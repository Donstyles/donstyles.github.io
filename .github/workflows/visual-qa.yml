name: Alpine Spawn Candidate Review

on:
  push:
    branches: [qa]

concurrency:
  group: alpine-spawn-review
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Start candidate server
        run: |
          python -m http.server 8000 >/tmp/alpine-server.log 2>&1 &
          sleep 2
      - name: Capture six analyzed spawn candidates
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageStat
          from pathlib import Path
          shots=[
            ('A_2000_-1500_south',2000,-1500,3.142,0.10),
            ('B_2000_-1500_sw',2000,-1500,3.927,0.10),
            ('C_2000_-1750_e',2000,-1750,1.571,0.10),
            ('D_2000_-1750_se',2000,-1750,1.963,0.10),
            ('E_1750_-2000_e',1750,-2000,1.571,0.10),
            ('F_1750_-1750_w',1750,-1750,4.712,0.10),
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True)
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox'])
            page=browser.new_page(viewport={'width':932,'height':430})
            for name,x,z,yaw,pitch in shots:
              page.goto(f'http://127.0.0.1:8000/index.html?qa=1&x={x}&z={z}&yaw={yaw}&pitch={pitch}',wait_until='load',timeout=30000)
              page.wait_for_timeout(1300)
              target=out/f'{name}.png'; page.screenshot(path=str(target))
              im=Image.open(target).convert('L'); print(name,round(ImageStat.Stat(im).mean[0],1),im.getextrema())
            browser.close()
          PY
      - name: Upload spawn candidates
        uses: actions/upload-artifact@v4
        with:
          name: alpine-spawn-candidates
          path: qa-shots/*.png
          if-no-files-found: error
