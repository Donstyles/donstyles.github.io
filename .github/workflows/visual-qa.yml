name: Alpine Visual QA

on:
  push:
    branches: [main, qa]

permissions:
  contents: write

jobs:
  visual-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch QA build
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # Pass 1: catastrophic billboard/camera bug and tonal range.
          reps={
            "gl.uniform3f(uni(treeP,'uUp'),up[0],up[1],up[2]);":"gl.uniform3f(uni(treeP,'uUp'),0,1,0);",
            "vec3 zen=vec3(.050,.071,.070), hor=vec3(.235,.262,.248);":"vec3 zen=vec3(.085,.105,.104), hor=vec3(.315,.335,.320);",
            "vec3 moss=vec3(.115,.145,.116), stone=vec3(.245,.250,.225), cold=vec3(.43,.45,.40);":"vec3 moss=vec3(.155,.185,.150), stone=vec3(.310,.315,.285), cold=vec3(.50,.52,.47);",
            "col*=.80+.22*floor(micro*4.0)/3.0; col*=nd;":"col*=.88+.18*floor(micro*4.0)/3.0; col*=mix(.78,1.0,nd);",
            "vec3 fogCol=vec3(.185,.210,.200);":"vec3 fogCol=vec3(.245,.268,.255);",
            "c=floor(c*22.0+.5)/22.0; c=mix(vec3(dot(c,vec3(.299,.587,.114))),c,.68); c*=.94;":"c=floor(c*30.0+.5)/30.0; c=mix(vec3(dot(c,vec3(.299,.587,.114))),c,.78); c*=1.05;",
            "c*=1.0-smoothstep(.32,.77,edge)*.34;":"c*=1.0-smoothstep(.38,.86,edge)*.20;",
            "mix-blend-mode:multiply; opacity:.66;":"mix-blend-mode:multiply; opacity:.36;",
          }
          for a,b in reps.items(): s=s.replace(a,b)

          # Pass 2: trees were vertically inverted; keep billboards world-upright.
          s=s.replace("vUv=vec2(aCorner.x+.5,aCorner.y+.5);", "vUv=vec2(aCorner.x+.5,1.0-(aCorner.y+.5));")

          # Replace the over-spiky ridged terrain with broad Alpine-scale ranges.
          old_js='''function terrainHeight(x,z){
            let amp=1, freq=0.00072, sum=0, norm=0;
            for(let i=0;i<5;i++){
              const n=noise2(x*freq,z*freq);
              const ridge=1-Math.abs(n*2-1);
              sum += ridge*ridge*amp; norm += amp; amp*=0.52; freq*=2.03;
            }
            const basin=noise2(x*0.00027+53,z*0.00027-19);
            const detail=noise2(x*0.0042-7,z*0.0042+13);
            return 180 + (sum/norm)*1500 + basin*650 + detail*18;
          }'''
          new_js='''function terrainHeight(x,z){
            const macro=noise2(x*0.00018+11,z*0.00018-7);
            const r0=1-Math.abs(noise2(x*0.00040-21,z*0.00040+31)*2-1);
            const r1=1-Math.abs(noise2(x*0.00078+47,z*0.00078-13)*2-1);
            const shoulder=noise2(x*0.00125-5,z*0.00125+17);
            const detail=noise2(x*0.0036+9,z*0.0036-29);
            const mountains=Math.pow(r0,2.25)*(430+760*macro)+Math.pow(r1,3.0)*170;
            return 430+macro*300+mountains+shoulder*90+detail*12;
          }'''
          s=s.replace(old_js,new_js)

          old_gl="float terrain(vec2 p){ float amp=1.0,freq=.00072,sum=0.0,norm=0.0; for(int i=0;i<5;i++){ float n=noise21(p*freq); float r=1.0-abs(n*2.0-1.0); sum+=r*r*amp; norm+=amp; amp*=.52; freq*=2.03; } float basin=noise21(p*.00027+vec2(53,-19)); float detail=noise21(p*.0042+vec2(-7,13)); return 180.0+(sum/norm)*1500.0+basin*650.0+detail*18.0; }"
          new_gl="float terrain(vec2 p){ float macro=noise21(p*.00018+vec2(11,-7)); float r0=1.0-abs(noise21(p*.00040+vec2(-21,31))*2.0-1.0); float r1=1.0-abs(noise21(p*.00078+vec2(47,-13))*2.0-1.0); float shoulder=noise21(p*.00125+vec2(-5,17)); float detail=noise21(p*.0036+vec2(9,-29)); float mountains=pow(r0,2.25)*(430.0+760.0*macro)+pow(r1,3.0)*170.0; return 430.0+macro*300.0+mountains+shoulder*90.0+detail*12.0; }"
          s=s.replace(old_gl,new_gl)

          # Longer vistas, slightly sparser/smaller forests, brighter atmospheric depth.
          s=s.replace("aGrid*vec2(1850.0)", "aGrid*vec2(2600.0)")
          s=s.replace("vDist/660.0", "vDist/920.0")
          s=s.replace("vDist/540.0", "vDist/760.0")
          s=s.replace("vec3 fogCol=vec3(.245,.268,.255)", "vec3 fogCol=vec3(.285,.305,.292)")
          s=s.replace("col=mix(col,vec3(.185,.210,.200),clamp(fog,0.0,.98));", "col=mix(col,vec3(.285,.305,.292),clamp(fog,0.0,.98));")
          s=s.replace("hor=vec3(.315,.335,.320)", "hor=vec3(.345,.360,.344)")
          s=s.replace("const cell=28, r=760", "const cell=31, r=820")
          s=s.replace("if(forest>.22 && localSlope<18 && alpine>0){ const s=(6.5+hash2(gx+7,gz+11)*8.5)*(.8+.2*alpine);", "if(forest>.30 && localSlope<16 && alpine>0){ const s=(5.5+hash2(gx+7,gz+11)*6.5)*(.82+.18*alpine);")
          s=s.replace("perspective(P,68*Math.PI/180,lowW/lowH,.35,4100)", "perspective(P,68*Math.PI/180,lowW/lowH,.35,5200)")

          # Deterministic camera controls for visual regression screenshots.
          if "const qaParams=new URLSearchParams(location.search);" not in s:
            old="if(new URLSearchParams(location.search).has('test')){document.getElementById('start').style.display='none';started=true;}"
            new="""const qaParams=new URLSearchParams(location.search);\nif(qaParams.has('test')||qaParams.has('qa')){document.getElementById('start').style.display='none';started=true;}\nif(qaParams.has('x')) pos.x=Number(qaParams.get('x'))||pos.x;\nif(qaParams.has('z')) pos.z=Number(qaParams.get('z'))||pos.z;\nif(qaParams.has('yaw')) yaw=Number(qaParams.get('yaw'))||0;\nif(qaParams.has('pitch')) pitch=Number(qaParams.get('pitch'))||0;\npos.y=terrainHeight(pos.x,pos.z)+1.72;"""
            s=s.replace(old,new)

          p.write_text(s)
          PY

      - name: Install Playwright
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start local server
        run: |
          python -m http.server 8000 > /tmp/alpine-server.log 2>&1 &
          echo $! > /tmp/alpine-server.pid
          sleep 2

      - name: Capture gameplay views
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageStat
          from pathlib import Path
          shots=[
            ('spawn',178,-612,2.34,-0.055),
            ('valley',600,-300,1.55,-0.02),
            ('ridge',-450,850,3.6,-0.08),
            ('forest',100,-950,0.4,-0.03),
            ('uphill',900,400,5.1,0.18),
            ('downlook',178,-612,2.34,-0.35),
            ('uplook',178,-612,2.34,0.38),
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True)
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=[
              '--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader',
              '--enable-unsafe-swiftshader','--disable-gpu-sandbox'
            ])
            page=browser.new_page(viewport={'width':1536,'height':709})
            for name,x,z,yaw,pitch in shots:
              url=f'http://127.0.0.1:8000/index.html?qa=1&x={x}&z={z}&yaw={yaw}&pitch={pitch}'
              page.goto(url,wait_until='load',timeout=30000)
              page.wait_for_timeout(1800)
              ok=page.evaluate("!!document.querySelector('#game').getContext('webgl2')")
              if not ok: raise RuntimeError('WebGL2 unavailable in QA runner')
              target=out/f'{name}.png'
              page.screenshot(path=str(target))
              im=Image.open(target).convert('L')
              st=ImageStat.Stat(im)
              mean=st.mean[0]
              lo,hi=im.getextrema()
              print(name,'mean_luma',round(mean,1),'range',(lo,hi))
              if mean < 28 or hi-lo < 55:
                raise RuntimeError(f'{name}: visually crushed frame (mean={mean:.1f}, range={hi-lo})')
            browser.close()
          PY

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-visual-qa
          path: qa-shots/*.png
          if-no-files-found: error

      - name: Commit QA patch to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No QA code changes"
          else
            git commit -m "QA: fix trees and broaden Alpine vistas"
            git pull --rebase origin qa
            git push origin HEAD:qa
          fi
