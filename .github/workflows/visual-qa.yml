name: Alpine Footpath Refinement Candidate

on:
  push:
    branches: [main]

concurrency:
  group: alpine-footpath-refinement
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch meadow breakup and ragged footpath
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          replacement="""float meadowA=noise21(vWorld.xz*.0042); float meadowB=noise21(vWorld.xz*.015+vec2(17,-11)); float meadowC=floor(noise21(vWorld.xz*.028+vec2(-23,7))*5.0)/4.0; float meadowD=floor(noise21(vWorld.xz*.074+vec2(31,13))*4.0)/3.0; float wet=smoothstep(.65,.87,noise21(vWorld.xz*.0024+vec2(-5,21))); vec3 grass=mix(vec3(.125,.175,.132),vec3(.225,.255,.175),meadowA*.52+meadowB*.34+meadowD*.14); grass*=.88+.20*meadowC+.050*meadowD; float dry=smoothstep(.61,.83,noise21(vWorld.xz*.0095+vec2(27,-35)))*(1.0-wet); grass=mix(grass,vec3(.235,.230,.150),dry*.16); grass=mix(grass,vec3(.070,.105,.102),wet*.36); float stonePatch=smoothstep(.72,.90,noise21(vWorld.xz*.018+vec2(-39,16)))*smoothstep(.50,.80,noise21(vWorld.xz*.0062+vec2(15,44))); grass=mix(grass,vec3(.235,.238,.214),stonePatch*.22*(1.0-rock)); float valleyCenter=550.0*sin(vWorld.z*.00028)+220.0*sin(vWorld.z*.00071+1.3); float cross=abs(vWorld.x-valleyCenter); float forestMacro=noise21(vWorld.xz*.0017+vec2(43,-27)); float forestFine=noise21(vWorld.xz*.0052+vec2(-12,8)); float forestZone=smoothstep(170.0,520.0,cross)*(1.0-smoothstep(1510.0,1760.0,vH))*(1.0-rock); float forestMass=smoothstep(.42,.69,forestMacro*.70+forestFine*.30)*forestZone; grass=mix(grass,vec3(.070,.105,.095),forestMass*.40); float pathWarp=(noise21(vec2(vWorld.z*.00145,7.3))-.5)*22.0+(noise21(vec2(vWorld.z*.0045,19.1))-.5)*5.0; float pathDist=abs(vWorld.x-valleyCenter-pathWarp); float edgeJitter=(noise21(vWorld.xz*.042+vec2(3,29))-.5)*4.0; float trail=1.0-smoothstep(5.5,15.0,pathDist+edgeJitter); float trailWear=.58+.42*noise21(vWorld.xz*.067+vec2(-17,11)); float trailBreak=.62+.38*noise21(vWorld.xz*.025+vec2(22,-31)); vec3 trailCol=mix(vec3(.165,.155,.118),vec3(.238,.218,.160),trailBreak); grass=mix(grass,trailCol,trail*.43*trailWear*(1.0-rock)); float trailCore=1.0-smoothstep(1.8,5.5,pathDist); grass=mix(grass,trailCol*.93,trailCore*.16*trailWear*(1.0-rock));"""
          pat=r"float meadowA=noise21\(vWorld\.xz\*\.0042\);.*?grass=mix\(grass,trailCol,trail\*\.68\*\(1\.0-rock\)\);"
          s,n=re.subn(pat,replacement,s,count=1)
          if n!=1: raise SystemExit('ground material patch failed')
          required=['float meadowD=','float stonePatch=','float edgeJitter=','float trailWear=','float trailCore=']
          missing=[q for q in required if q not in s]
          if missing: raise SystemExit('missing path refinement: '+repr(missing))
          p.write_text(s)
          PY

      - name: Install browser QA
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start server
        run: |
          python -m http.server 8000 >/tmp/alpine-server.log 2>&1 &
          sleep 2

      - name: Capture candidate
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageStat
          from pathlib import Path
          import json,re
          shots=[
            ('default',None,None),('yaw018',.18,.28),('yaw035',.35,.28),
            ('left90',-1.29,.28),('right90',1.85,.28),('back',3.42,.28),
            ('look_down',.28,-.20),('walk_ahead',.28,.22),
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True)
          metrics=[]; errors=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox'])
            context=browser.new_context(viewport={'width':932,'height':430},has_touch=True,is_mobile=True,device_scale_factor=1)
            page=context.new_page()
            page.on('pageerror', lambda exc: errors.append('pageerror: '+str(exc)))
            page.on('console', lambda msg: errors.append('console error: '+msg.text) if msg.type=='error' else None)
            for name,yaw,pitch in shots:
              qs=['qa=1']
              if yaw is not None: qs.append(f'yaw={yaw}')
              if pitch is not None: qs.append(f'pitch={pitch}')
              page.goto('http://127.0.0.1:8000/index.html?'+'&'.join(qs),wait_until='load',timeout=30000)
              page.wait_for_timeout(1500)
              if name=='walk_ahead':
                page.keyboard.down('KeyW'); page.wait_for_timeout(2200); page.keyboard.up('KeyW'); page.wait_for_timeout(450)
              if not page.evaluate("!!document.querySelector('#game').getContext('webgl2')"): raise SystemExit('WebGL2 unavailable')
              target=out/f'{name}.png'; page.screenshot(path=str(target))
              im=Image.open(target).convert('L'); hist=im.histogram(); total=sum(hist)
              mean=ImageStat.Stat(im).mean[0]; near_black=sum(hist[:18])/total; lo,hi=im.getextrema()
              metrics.append({'name':name,'mean':mean,'near_black':near_black,'range':hi-lo})

            # Keyboard movement in QA mode avoids fullscreen/pointer-lock artifacts.
            page.goto('http://127.0.0.1:8000/index.html?qa=1',wait_until='load',timeout=30000); page.wait_for_timeout(650)
            page.keyboard.press('Backquote'); page.wait_for_timeout(120)
            before=page.locator('#debug').inner_text(); page.keyboard.down('KeyW'); page.wait_for_timeout(1400); page.keyboard.up('KeyW'); page.wait_for_timeout(200); after=page.locator('#debug').inner_text()
            def coords(text):
              m=re.search(r'(-?\d+)m\s+(-?\d+)m',text); return (int(m.group(1)),int(m.group(2))) if m else None
            if not coords(before) or coords(before)==coords(after): raise SystemExit('Walking input failed: '+repr((before,after)))
            browser.close()
          (out/'metrics.json').write_text(json.dumps({'metrics':metrics,'errors':errors},indent=2))
          if errors: raise SystemExit('Browser errors: '+repr(errors))
          bad=[m for m in metrics if m['mean']<48 or m['near_black']>.08 or m['range']<65]
          if bad: raise SystemExit('Readability guardrail failed: '+repr(bad))
          PY

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpine-footpath-refinement-review
          path: qa-shots/*
          if-no-files-found: error

      - name: Commit candidate to QA
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine Alpine footpath and meadow breakup'
          git push origin HEAD:qa
