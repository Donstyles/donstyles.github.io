name: Alpine Visual QA

on:
  push:
    branches: [main]

concurrency:
  group: alpine-visual-qa
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  visual-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build final mood candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          if 'return (h>>>8)/16777216' not in s or 'float(h>>8u)*(1.0/16777216.0)' not in s:
              raise SystemExit('Deterministic terrain base missing')

          # Low-contrast layered storm deck: modulation only, never a solid cloud silhouette.
          a=s.index('const skyP = program('); b=s.index('const terrainP = program(',a)
          sky=s[a:b]
          mood='''void main(){ vec2 uv=vUv; float y=clamp(uv.y,0.0,1.0); vec3 horizon=vec3(.365,.395,.388), zenith=vec3(.125,.150,.155); vec3 col=mix(horizon,zenith,smoothstep(.02,.94,y)); vec2 q=vec2(uv.x*6.5+uLook.x*.55,uv.y*2.2+uTime*.0025); float c=.65*noise21(q*2.0+vec2(7,-3))+.35*noise21(q*5.0+vec2(-9,4)); float cloud=(c-.5); float mask=smoothstep(.08,.40,y)*(1.0-smoothstep(.78,1.0,y)); col*=1.0+cloud*.16*mask; float mist=exp(-pow((y-.13)/.20,2.0)); col=mix(col,vec3(.390,.415,.405),mist*.12); float band=floor((1.0-y)*28.0)/28.0; col*=.965+.045*band; o=vec4(col,1); }'''
          sky,n=re.subn(r'void main\(\)\{ vec2 uv=vUv;.*?o=vec4\(col,1\); \}',mood,sky,count=1)
          if n!=1: raise SystemExit('Sky mood patch failed')
          s=s[:a]+sky+s[b:]

          # Stronger snow/rock separation plus brighter atmospheric perspective.
          s=s.replace('cold=vec3(.68,.695,.665)','cold=vec3(.80,.815,.790)',1)
          s=s.replace('col=mix(col,cold,snow*.70)','col=mix(col,cold,snow*.82)',1)
          s=s.replace('vec3 fogCol=vec3(.300,.320,.306)','vec3 fogCol=vec3(.355,.375,.365)',1)
          s=s.replace('col=mix(col,vec3(.300,.320,.306),clamp(fog,0.0,.98));','col=mix(col,vec3(.355,.375,.365),clamp(fog,0.0,.98));',1)

          # Slightly coarser late-90s palette/raster feel; preserve landscape readability.
          s=s.replace('c=floor(c*30.0+.5)/30.0','c=floor(c*24.0+.5)/24.0',1)
          s=s.replace('c,mix(vec3(dot(c,vec3(.299,.587,.114))),c,.78)','c,mix(vec3(dot(c,vec3(.299,.587,.114))),c,.72)',1) if False else s
          s=s.replace("c=mix(vec3(dot(c,vec3(.299,.587,.114))),c,.78);", "c=mix(vec3(dot(c,vec3(.299,.587,.114))),c,.72);",1)
          s=s.replace('c*=1.08;','c*=1.06;',1)
          s=s.replace("c*=1.0-smoothstep(.40,.88,edge)*.16;", "c*=1.0-smoothstep(.40,.88,edge)*.19; c*=.985+.015*step(.5,fract(gl_FragCoord.y*.5));",1)
          s=s.replace('opacity:.24;','opacity:.27;',1)

          required=['cloud*.16*mask','cold=vec3(.80,.815,.790)','vec3 fogCol=vec3(.355,.375,.365)','c*24.0','opacity:.27;']
          missing=[q for q in required if q not in s]
          if missing: raise SystemExit('Mood patch missing: '+repr(missing))
          p.write_text(s)
          PY

      - name: Install browser QA
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start local server
        run: |
          python -m http.server 8000 >/tmp/alpine-server.log 2>&1 &
          sleep 2

      - name: Capture final iPhone views
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageStat
          from pathlib import Path
          import json
          shots=[
            ('spawn_peak',8500,-13000,3.40,-.025),
            ('north',8500,-13000,0.0,-.025),
            ('east',8500,-13000,1.57,-.025),
            ('south',8500,-13000,3.14,-.025),
            ('west',8500,-13000,4.71,-.025),
            ('northeast',8500,-13000,.78,-.025),
            ('look_up',8500,-13000,3.40,.38),
            ('look_down',8500,-13000,3.40,-.38),
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True)
          metrics=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox'])
            page=browser.new_page(viewport={'width':932,'height':430})
            for name,x,z,yaw,pitch in shots:
              page.goto(f'http://127.0.0.1:8000/index.html?qa=1&x={x}&z={z}&yaw={yaw}&pitch={pitch}',wait_until='load',timeout=30000)
              page.wait_for_timeout(1800)
              if not page.evaluate("!!document.querySelector('#game').getContext('webgl2')"):
                  raise RuntimeError('WebGL2 unavailable')
              target=out/f'{name}.png'; page.screenshot(path=str(target))
              im=Image.open(target).convert('L'); hist=im.histogram(); total=sum(hist)
              mean=ImageStat.Stat(im).mean[0]; black=sum(hist[:18])/total; lo,hi=im.getextrema()
              metrics.append({'name':name,'mean':mean,'black':black,'range':hi-lo})
              print(name,'mean',round(mean,1),'black',round(black,4),'range',hi-lo)
            browser.close()
          Path('qa-metrics.json').write_text(json.dumps(metrics,indent=2))
          PY

      - name: Upload final screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: alpine-visual-qa-final-mood
          path: |
            qa-shots/*.png
            qa-metrics.json
          if-no-files-found: error

      - name: Evaluate final guardrails
        run: |
          python - <<'PY'
          import json
          m=json.load(open('qa-metrics.json'))
          bad=[x for x in m if x['mean']<42 or x['black']>.10 or x['range']<55]
          if bad: raise SystemExit('Final readability guardrail failed: '+repr(bad))
          PY

      - name: Commit candidate to QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No QA code changes"
          else
            git commit -m "QA: final moody alpine art pass"
            git pull --rebase origin qa
            git push origin HEAD:qa
          fi
