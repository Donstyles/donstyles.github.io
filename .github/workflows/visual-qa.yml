name: Alpine Visual QA

on:
  push:
    branches: [qa]

permissions:
  contents: write

jobs:
  visual-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build QA candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          reps={
            'vec3 zen=vec3(.115,.132,.130), hor=vec3(.385,.400,.388);':'vec3 zen=vec3(.165,.180,.176), hor=vec3(.430,.445,.433);',
            'cloud=smoothstep(.50,.80,c)':'cloud=smoothstep(.52,.84,c)',
            'col=mix(col,vec3(.190,.208,.202),cloud*.38)':'col=mix(col,vec3(.220,.235,.228),cloud*.22)',
            'mix-blend-mode:multiply; opacity:.36;':'mix-blend-mode:multiply; opacity:.24;',
            'c*=1.05;':'c*=1.08;',
            '*2.0-1.0)*.012;':'*2.0-1.0)*.009;',
            "uTime*17.0)-.5)*.018;":"uTime*17.0)-.5)*.012;",
            'smoothstep(.38,.86,edge)*.20':'smoothstep(.40,.88,edge)*.16',
          }
          for a,b in reps.items():
              if a not in s: raise SystemExit('Missing patch target: '+a)
              s=s.replace(a,b,1)
          p.write_text(s)
          PY

      - name: Install Playwright
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Start local server
        run: |
          python -m http.server 8000 > /tmp/alpine-server.log 2>&1 &
          sleep 2
      - name: Capture six gameplay views
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageStat
          from pathlib import Path
          shots=[
            ('spawn_peak',0,0,5.323,-0.04),('spawn_southwest',0,0,3.58,-0.03),
            ('open_valley',0,0,0.35,-0.02),('forest_edge',900,-350,5.0,-0.04),
            ('high_pass',-1700,-2200,2.25,-0.08),('pitch_stress',0,0,5.323,0.42),
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True); metrics=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox'])
            page=browser.new_page(viewport={'width':1536,'height':709})
            for name,x,z,yaw,pitch in shots:
              page.goto(f'http://127.0.0.1:8000/index.html?qa=1&x={x}&z={z}&yaw={yaw}&pitch={pitch}',wait_until='load',timeout=30000)
              page.wait_for_timeout(1800)
              if not page.evaluate("!!document.querySelector('#game').getContext('webgl2')"): raise RuntimeError('WebGL2 unavailable')
              target=out/f'{name}.png'; page.screenshot(path=str(target))
              im=Image.open(target).convert('L'); st=ImageStat.Stat(im); hist=im.histogram(); total=sum(hist)
              mean=st.mean[0]; dark=sum(hist[:18])/total; metrics.append((name,mean,dark,im.getextrema()))
              print(name,'mean_luma',round(mean,1),'near_black',round(dark,4),'range',im.getextrema())
            browser.close()
          bad=[m for m in metrics if m[1] < 48 or m[1] > 95 or m[2] > .18]
          if bad: raise SystemExit('Visual readability guardrail failed: '+repr(bad))
          PY
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-visual-qa-pass4
          path: qa-shots/*.png
          if-no-files-found: error
      - name: Commit candidate to QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No QA code changes"; else
            git commit -m "QA4: lighter overcast and cleaner retro post"
            git pull --rebase origin qa
            git push origin HEAD:qa
          fi
