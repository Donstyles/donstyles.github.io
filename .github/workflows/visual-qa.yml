name: Alpine Visual QA

on:
  push:
    branches: [main]

concurrency:
  group: alpine-visual-qa
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  visual-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build flat-sky diagnostic candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          # Decisive diagnostic: zero procedural cloud masses. Only a graded overcast sky.
          a=s.index('const skyP = program(')
          b=s.index('const terrainP = program(', a)
          sky=s[a:b]
          flat='''void main(){ vec2 uv=vUv; float y=clamp(uv.y,0.0,1.0); vec3 horizon=vec3(.405,.425,.415); vec3 zenith=vec3(.180,.202,.200); vec3 col=mix(horizon,zenith,smoothstep(.02,.92,y)); float band=floor((1.0-y)*28.0)/28.0; col*=.97+.04*band; o=vec4(col,1); }'''
          sky2=re.sub(r'void main\(\)\{ vec2 uv=vUv;.*?o=vec4\(col,1\); \}', flat, sky, count=1)
          if sky2==sky: raise SystemExit('Sky shader replacement failed')
          s=s[:a]+sky2+s[b:]

          # Keep the scenic valley spawn and non-dominating tree scale in the diagnostic.
          s=re.sub(r"let pos=\{x:[^,]+,z:[^}]+\}, yaw=[^,]+,pitch=[^,]+, bob=", "let pos={x:3750,z:5750}, yaw=.262,pitch=-.035, bob=", s, count=1)
          s=re.sub(r"const cell=\d+, r=\d+", "const cell=38, r=1120", s, count=1)
          s=re.sub(r"forest>\.\d+ && localSlope<16", "forest>.50 && localSlope<16", s, count=1)
          s=re.sub(r"const s=\([^;]+?\)\*\(\.82\+\.18\*alpine\);", "const s=(4.8+hash2(gx+7,gz+11)*5.7)*(.82+.18*alpine);", s, count=1)

          if 'horizon=vec3(.405,.425,.415)' not in s or 'noise21(q*3.7)' in s[a:s.index('const terrainP = program(',a)]:
              raise SystemExit('Flat-sky diagnostic not clean')
          p.write_text(s)
          PY

      - name: Install browser QA
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start local server
        run: |
          python -m http.server 8000 >/tmp/alpine-server.log 2>&1 &
          sleep 2

      - name: Capture seven iPhone stress views
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageStat
          from pathlib import Path
          shots=[
            ('spawn',3750,5750,.262,-.035),
            ('spawn_left',3750,5750,5.55,-.035),
            ('spawn_right',3750,5750,1.15,-.035),
            ('pitch_up',3750,5750,.262,.42),
            ('pitch_down',3750,5750,.262,-.42),
            ('forest_edge',4500,7000,1.13,-.03),
            ('high_pass',-1700,-2200,2.25,-.08),
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True)
          metrics=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox'])
            page=browser.new_page(viewport={'width':932,'height':430})
            for name,x,z,yaw,pitch in shots:
              page.goto(f'http://127.0.0.1:8000/index.html?qa=1&x={x}&z={z}&yaw={yaw}&pitch={pitch}',wait_until='load',timeout=30000)
              page.wait_for_timeout(1800)
              if not page.evaluate("!!document.querySelector('#game').getContext('webgl2')"): raise RuntimeError('WebGL2 unavailable')
              target=out/f'{name}.png'; page.screenshot(path=str(target))
              im=Image.open(target).convert('L'); hist=im.histogram(); total=sum(hist)
              mean=ImageStat.Stat(im).mean[0]; black=sum(hist[:18])/total; lo,hi=im.getextrema()
              metrics.append((name,mean,black,hi-lo)); print(name,round(mean,1),round(black,4),hi-lo)
            browser.close()
          bad=[m for m in metrics if m[1] < 45 or m[2] > .10 or m[3] < 60]
          if bad: raise SystemExit('Readability guardrail failed: '+repr(bad))
          PY

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-visual-qa-flat-sky
          path: qa-shots/*.png
          if-no-files-found: error

      - name: Commit diagnostic candidate to QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No QA code changes"
          else
            git commit -m "QA: remove cloud mass for sky diagnostic"
            git pull --rebase origin qa
            git push origin HEAD:qa
          fi
