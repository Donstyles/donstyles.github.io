name: Alpine Review Gate

on:
  push:
    branches: [main, qa]

concurrency:
  group: alpine-review-gate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser QA
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start candidate server
        run: |
          python -m http.server 8000 >/tmp/alpine-server.log 2>&1 &
          sleep 2

      - name: Capture iPhone review set
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageStat, ImageChops
          from pathlib import Path
          import re

          shots=[
            ('spawn',None,None,None,None),
            ('left',None,None,5.55,-.035),
            ('right',None,None,1.15,-.035),
            ('look_up',None,None,.262,.42),
            ('look_down',None,None,.262,-.42),
            ('forest_edge',4500,7000,1.13,-.03),
            ('high_pass',-1700,-2200,2.25,-.08),
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True)
          metrics=[]; errors=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox'])
            context=browser.new_context(viewport={'width':932,'height':430},has_touch=True,is_mobile=True,device_scale_factor=1)
            page=context.new_page()
            page.on('pageerror', lambda exc: errors.append('pageerror: '+str(exc)))
            page.on('console', lambda msg: errors.append('console error: '+msg.text) if msg.type=='error' else None)
            for name,x,z,yaw,pitch in shots:
              qs=['qa=1']
              if x is not None: qs.append(f'x={x}')
              if z is not None: qs.append(f'z={z}')
              if yaw is not None: qs.append(f'yaw={yaw}')
              if pitch is not None: qs.append(f'pitch={pitch}')
              page.goto('http://127.0.0.1:8000/index.html?'+'&'.join(qs),wait_until='load',timeout=30000)
              page.wait_for_timeout(1600)
              if not page.evaluate("!!document.querySelector('#game').getContext('webgl2')"):
                raise SystemExit('WebGL2 unavailable')
              target=out/f'{name}.png'; page.screenshot(path=str(target))
              im=Image.open(target).convert('L'); hist=im.histogram(); total=sum(hist)
              mean=ImageStat.Stat(im).mean[0]; near_black=sum(hist[:18])/total; lo,hi=im.getextrema()
              metrics.append((name,mean,near_black,hi-lo))
              print(name,'mean',round(mean,1),'near_black',round(near_black,4),'range',hi-lo)

            # Interaction gate on the actual start screen.
            page.goto('http://127.0.0.1:8000/index.html',wait_until='load',timeout=30000)
            page.wait_for_timeout(1000)
            if not page.is_visible('#enter'): raise SystemExit('Entry screen missing')
            page.click('#enter'); page.wait_for_timeout(400)
            page.keyboard.press('Backquote'); page.wait_for_timeout(150)
            before=page.locator('#debug').inner_text()
            page.mouse.move(120,330); page.mouse.down(); page.mouse.move(120,245,steps=3); page.wait_for_timeout(800); page.mouse.up(); page.wait_for_timeout(200)
            after=page.locator('#debug').inner_text()
            def coords(text):
              m=re.search(r'(-?\d+)m\s+(-?\d+)m',text); return (int(m.group(1)),int(m.group(2))) if m else None
            if not coords(before) or coords(before)==coords(after): raise SystemExit('Walking input failed')
            browser.close()

          bad=[m for m in metrics if m[1] < 45 or m[2] > .12 or m[3] < 60]
          if bad: raise SystemExit('Readability guardrail failed: '+repr(bad))
          if errors: raise SystemExit('Browser errors: '+repr(errors))
          PY

      - name: Upload review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: alpine-review-shots
          path: qa-shots/*.png
          if-no-files-found: error
