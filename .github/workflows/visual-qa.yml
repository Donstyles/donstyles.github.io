name: Alpine Scenic Sweep

on:
  push:
    branches: [qa]

concurrency:
  group: alpine-scenic-sweep
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Start candidate server
        run: |
          python -m http.server 8000 >/tmp/alpine-server.log 2>&1 &
          sleep 2
      - name: Capture analyzed valley yaw sweep
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageStat
          from pathlib import Path
          shots=[
            ('n_000',0.000),('ne_045',0.785),('e_090',1.571),('se_135',2.356),
            ('s_180',3.142),('sw_225',3.927),('w_270',4.712),('nw_315',5.498)
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True)
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox'])
            page=browser.new_page(viewport={'width':932,'height':430})
            for name,yaw in shots:
              page.goto(f'http://127.0.0.1:8000/index.html?qa=1&x=2000&z=-1500&yaw={yaw}&pitch=0.075',wait_until='load',timeout=30000)
              page.wait_for_timeout(1300)
              target=out/f'{name}.png'; page.screenshot(path=str(target))
              im=Image.open(target).convert('L'); print(name,round(ImageStat.Stat(im).mean[0],1),im.getextrema())
            browser.close()
          PY
      - name: Upload scenic sweep
        uses: actions/upload-artifact@v4
        with:
          name: alpine-scenic-yaw-sweep
          path: qa-shots/*.png
          if-no-files-found: error
