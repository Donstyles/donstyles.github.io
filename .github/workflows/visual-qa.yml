name: Alpine UV Fix Review

on:
  push:
    branches: [qa]

concurrency:
  group: alpine-uv-review
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fix fullscreen UV mapping and remove obsolete clip hack
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old='vUv=p; gl_Position=vec4(p*2.0-1.0,0,1);'
          hits=s.count(old)
          if hits != 2: raise SystemExit(f'Expected 2 fullscreen UV sites, found {hits}')
          s=s.replace(old,'vUv=p*.5; gl_Position=vec4(p*2.0-1.0,0,1);')
          mag="gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);"
          scene_guard=mag+"gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);"
          if scene_guard not in s: s=s.replace(mag,scene_guard,1)
          s=s.replace('out vec4 o; uniform vec3 uCam; uniform vec3 uForward; uniform float uTime;','out vec4 o; uniform vec3 uCam; uniform float uTime;',1)
          s=s.replace('void main(){ if(dot(vWorld-uCam,uForward)<0.5) discard; vec3 n=normalize(vNormal);','void main(){ vec3 n=normalize(vNormal);',1)
          s=s.replace("gl.uniform3f(uni(terrainP,'uCam'),pos.x,pos.y,pos.z);gl.uniform3f(uni(terrainP,'uForward'),sy,0,cy);gl.uniform1f(uni(terrainP,'uTime'),seconds);","gl.uniform3f(uni(terrainP,'uCam'),pos.x,pos.y,pos.z);gl.uniform1f(uni(terrainP,'uTime'),seconds);",1)
          p.write_text(s)
          PY

      - name: Install browser QA
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start candidate server
        run: |
          python -m http.server 8000 >/tmp/alpine-server.log 2>&1 &
          sleep 2

      - name: Capture seven iPhone review views
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageStat
          from pathlib import Path
          shots=[('spawn',None,None,None,None),('left',None,None,5.55,-.035),('right',None,None,1.15,-.035),('look_up',None,None,.262,.42),('look_down',None,None,.262,-.42),('forest_edge',4500,7000,1.13,-.03),('high_pass',-1700,-2200,2.25,-.08)]
          out=Path('qa-shots'); out.mkdir(exist_ok=True); metrics=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox'])
            page=browser.new_page(viewport={'width':932,'height':430})
            for name,x,z,yaw,pitch in shots:
              qs=['qa=1']
              if x is not None: qs.append(f'x={x}')
              if z is not None: qs.append(f'z={z}')
              if yaw is not None: qs.append(f'yaw={yaw}')
              if pitch is not None: qs.append(f'pitch={pitch}')
              page.goto('http://127.0.0.1:8000/index.html?'+'&'.join(qs),wait_until='load',timeout=30000)
              page.wait_for_timeout(1600)
              if not page.evaluate("!!document.querySelector('#game').getContext('webgl2')"): raise SystemExit('WebGL2 unavailable')
              target=out/f'{name}.png'; page.screenshot(path=str(target))
              im=Image.open(target).convert('L'); hist=im.histogram(); total=sum(hist); mean=ImageStat.Stat(im).mean[0]; black=sum(hist[:18])/total; lo,hi=im.getextrema()
              metrics.append((name,mean,black,hi-lo)); print(name,round(mean,1),round(black,4),hi-lo)
            browser.close()
          bad=[m for m in metrics if m[1]<40 or m[2]>.12 or m[3]<60]
          if bad: raise SystemExit('Readability guardrail failed: '+repr(bad))
          PY

      - name: Upload UV-fix review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: alpine-uv-fix-review
          path: qa-shots/*.png
          if-no-files-found: error

      - name: Commit fix to QA only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "QA index already contains UV fix"; else
            git commit -m "Fix fullscreen scene UV mapping"
            git pull --rebase origin qa
            git push origin HEAD:qa
          fi
