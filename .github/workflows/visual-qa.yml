name: Alpine Visual QA

on:
  push:
    branches: [main]

concurrency:
  group: alpine-visual-qa
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  visual-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build clean overcast candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          if 'return (h>>>8)/16777216' not in s: raise SystemExit('Deterministic terrain missing')

          a=s.index('const skyP = program('); b=s.index('const terrainP = program(',a)
          sky=s[a:b]
          clean='''void main(){ vec2 uv=vUv; float y=clamp(uv.y,0.0,1.0); vec3 horizon=vec3(.370,.398,.392), zenith=vec3(.145,.165,.170); vec3 col=mix(horizon,zenith,smoothstep(.02,.96,y)); vec2 q=vec2(uv.x*9.0+uLook.x*.70,uv.y*3.6+uTime*.0030); float c=.58*noise21(q*2.8+vec2(7,-3))+.42*noise21(q*6.2+vec2(-9,4)); float texture=(c-.5)*.055; float mask=smoothstep(.10,.35,y)*(1.0-smoothstep(.94,1.0,y)); col+=vec3(texture*mask); float mist=exp(-pow((y-.10)/.18,2.0)); col=mix(col,vec3(.400,.420,.412),mist*.14); float band=floor((1.0-y)*30.0)/30.0; col*=.970+.040*band; o=vec4(col,1); }'''
          sky,n=re.subn(r'void main\(\)\{ vec2 uv=vUv;.*?o=vec4\(col,1\); \}',clean,sky,count=1)
          if n!=1: raise SystemExit('Clean sky patch failed')
          s=s[:a]+sky+s[b:]
          if 'texture=(c-.5)*.055' not in s: raise SystemExit('Clean overcast missing')
          p.write_text(s)
          PY

      - name: Install browser QA
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start local server
        run: |
          python -m http.server 8000 >/tmp/alpine-server.log 2>&1 &
          sleep 2

      - name: Capture final iPhone views
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageStat
          from pathlib import Path
          import json
          shots=[
            ('spawn_peak',8500,-13000,3.40,-.025),
            ('north',8500,-13000,0.0,-.025),
            ('east',8500,-13000,1.57,-.025),
            ('south',8500,-13000,3.14,-.025),
            ('west',8500,-13000,4.71,-.025),
            ('look_up',8500,-13000,3.40,.38),
            ('look_down',8500,-13000,3.40,-.38),
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True)
          metrics=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox'])
            page=browser.new_page(viewport={'width':932,'height':430})
            for name,x,z,yaw,pitch in shots:
              page.goto(f'http://127.0.0.1:8000/index.html?qa=1&x={x}&z={z}&yaw={yaw}&pitch={pitch}',wait_until='load',timeout=30000)
              page.wait_for_timeout(1800)
              if not page.evaluate("!!document.querySelector('#game').getContext('webgl2')"): raise RuntimeError('WebGL2 unavailable')
              target=out/f'{name}.png'; page.screenshot(path=str(target))
              im=Image.open(target).convert('L'); hist=im.histogram(); total=sum(hist)
              mean=ImageStat.Stat(im).mean[0]; black=sum(hist[:18])/total; lo,hi=im.getextrema()
              metrics.append({'name':name,'mean':mean,'black':black,'range':hi-lo})
              print(name,round(mean,1),round(black,4),hi-lo)
            browser.close()
          Path('qa-metrics.json').write_text(json.dumps(metrics,indent=2))
          PY

      - name: Upload final screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: alpine-visual-qa-clean-overcast
          path: |
            qa-shots/*.png
            qa-metrics.json
          if-no-files-found: error

      - name: Evaluate final guardrails
        run: |
          python - <<'PY'
          import json
          m=json.load(open('qa-metrics.json'))
          bad=[x for x in m if x['mean']<42 or x['black']>.10 or x['range']<55]
          if bad: raise SystemExit('Final readability guardrail failed: '+repr(bad))
          PY

      - name: Commit candidate to QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No QA code changes"
          else
            git commit -m "QA: clean textured overcast"
            git pull --rebase origin qa
            git push origin HEAD:qa
          fi
