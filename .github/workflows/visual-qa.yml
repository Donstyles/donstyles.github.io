name: Alpine Visual QA

on:
  push:
    branches: [qa]

permissions:
  contents: write

jobs:
  visual-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build QA candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old="vec2 q=vec2(uv.x*3.0+uLook.x*.12, uv.y*.7+uTime*.0014); float c=noise21(q*3.7)+.55*noise21(q*8.3+8.0)+.28*noise21(q*16.0-4.0); c/=1.83; float cloud=smoothstep(.52,.84,c)*(1.0-smoothstep(.58,1.0,y)); col=mix(col,vec3(.220,.235,.228),cloud*.22);"
          new="vec2 q=vec2(uv.x*3.0+uLook.x*.12, uv.y*.7+uTime*.0014); float c=noise21(q*3.7)+.55*noise21(q*8.3+8.0)+.28*noise21(q*16.0-4.0); c/=1.83; float cloud=(c-.5)*(1.0-smoothstep(.70,1.0,y)); col*=.965+cloud*.12;"
          if old not in s: raise SystemExit('Sky block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Install Playwright
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Start local server
        run: |
          python -m http.server 8000 > /tmp/alpine-server.log 2>&1 &
          sleep 2
      - name: Capture six gameplay views
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageStat
          from pathlib import Path
          shots=[
            ('spawn_peak',0,0,5.323,-0.04),('spawn_southwest',0,0,3.58,-0.03),
            ('open_valley',0,0,0.35,-0.02),('forest_edge',900,-350,5.0,-0.04),
            ('high_pass',-1700,-2200,2.25,-0.08),('pitch_stress',0,0,5.323,0.42),
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True); metrics=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox'])
            page=browser.new_page(viewport={'width':1536,'height':709})
            for name,x,z,yaw,pitch in shots:
              page.goto(f'http://127.0.0.1:8000/index.html?qa=1&x={x}&z={z}&yaw={yaw}&pitch={pitch}',wait_until='load',timeout=30000)
              page.wait_for_timeout(1800)
              if not page.evaluate("!!document.querySelector('#game').getContext('webgl2')"): raise RuntimeError('WebGL2 unavailable')
              target=out/f'{name}.png'; page.screenshot(path=str(target))
              im=Image.open(target).convert('L'); st=ImageStat.Stat(im); hist=im.histogram(); total=sum(hist)
              mean=st.mean[0]; dark=sum(hist[:18])/total; metrics.append((name,mean,dark,im.getextrema()))
              print(name,'mean_luma',round(mean,1),'near_black',round(dark,4),'range',im.getextrema())
            browser.close()
          bad=[m for m in metrics if m[1] < 48 or m[1] > 100 or m[2] > .18]
          if bad: raise SystemExit('Visual readability guardrail failed: '+repr(bad))
          PY
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-visual-qa-pass5
          path: qa-shots/*.png
          if-no-files-found: error
      - name: Commit candidate to QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No QA code changes"; else
            git commit -m "QA5: continuous overcast sky without hard cloud edge"
            git pull --rebase origin qa
            git push origin HEAD:qa
          fi
