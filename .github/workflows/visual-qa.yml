name: Alpine Visual QA

on:
  push:
    branches: [main]

concurrency:
  group: alpine-visual-qa
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  visual-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build deterministic terrain candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import math,re
          p=Path('index.html')
          s=p.read_text()

          # CPU/GPU must hash lattice coordinates identically.  The high 24 bits are
          # exactly representable in float, so this avoids the old JS-double vs GLSL-float
          # sine-hash divergence that put the camera inside a different GPU terrain.
          js="function hash2(x,z){ let h=(Math.imul(x|0,374761393)+Math.imul(z|0,668265263))|0; h=Math.imul((h^(h>>>13))|0,1274126177)|0; h=(h^(h>>>16))>>>0; return (h>>>8)/16777216; }"
          s,n=re.subn(r"function hash2\(x,z\)\{[^\n]*\}",js,s,count=1)
          if n!=1: raise SystemExit('CPU hash patch failed')

          glsl="float hash21(vec2 p){ ivec2 i=ivec2(p); uint h=uint(i.x)*374761393u + uint(i.y)*668265263u; h=(h^(h>>13u))*1274126177u; h^=h>>16u; return float(h>>8u)*(1.0/16777216.0); }"
          s,n=re.subn(r"float hash21\(vec2 p\)\{[^\n]*\}",glsl,s,count=1)
          if n!=1: raise SystemExit('GPU hash patch failed')

          # Broad valley found against this deterministic terrain field; face the distant ridge.
          s=re.sub(r"let pos=\{x:[^,]+,z:[^}]+\}, yaw=[^,]+,pitch=[^,]+, bob=",
                   "let pos={x:8500,z:-13000}, yaw=3.40,pitch=-.025, bob=",s,count=1)
          required=['return (h>>>8)/16777216','float(h>>8u)*(1.0/16777216.0)','let pos={x:8500,z:-13000}, yaw=3.40']
          missing=[q for q in required if q not in s]
          if missing: raise SystemExit('Deterministic patch missing: '+repr(missing))
          p.write_text(s)

          # Independent exact-hash terrain sanity check.
          MASK=0xffffffff
          def hsh(x,z):
              h=((int(x)&MASK)*374761393 + (int(z)&MASK)*668265263)&MASK
              h=((h^(h>>13))*1274126177)&MASK
              h=(h^(h>>16))&MASK
              return (h>>8)/16777216.0
          def fract(x): return x-math.floor(x)
          def noise(x,z):
              ix,iz=math.floor(x),math.floor(z); fx,fz=fract(x),fract(z)
              ux,uz=fx*fx*(3-2*fx),fz*fz*(3-2*fz)
              a,b,c,d=hsh(ix,iz),hsh(ix+1,iz),hsh(ix,iz+1),hsh(ix+1,iz+1)
              return ((a*(1-ux)+b*ux)*(1-uz)+(c*(1-ux)+d*ux)*uz)
          def terrain(x,z):
              macro=noise(x*.00012+11,z*.00012-7)
              r0=1-abs(noise(x*.00028-21,z*.00028+31)*2-1)
              r1=1-abs(noise(x*.00055+47,z*.00055-13)*2-1)
              shoulder=noise(x*.00110-5,z*.00110+17)
              detail=noise(x*.0028+9,z*.0028-29)
              mountains=(r0**2.7)*(1050+1050*macro)+(r1**3.0)*360
              return 430+macro*300+mountains+shoulder*110+detail*18
          x,z=8500.0,-13000.0; eye=terrain(x,z)+1.72
          max_near=max_all=max_far=-90.0
          for i in range(72):
              a=i*2*math.pi/72
              for r in range(250,6001,250):
                  hh=terrain(x+math.sin(a)*r,z+math.cos(a)*r)
                  e=math.degrees(math.atan2(hh-eye,r))
                  max_all=max(max_all,e)
                  if r<=1000: max_near=max(max_near,e)
                  if r>=3000: max_far=max(max_far,e)
          print('spawn altitude',round(terrain(x,z),1),'skyline near/all/far',round(max_near,2),round(max_all,2),round(max_far,2))
          if max_near>10 or max_all>24 or max_far<10:
              raise SystemExit('Deterministic spawn rejected')
          PY

      - name: Install browser QA
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start local server
        run: |
          python -m http.server 8000 >/tmp/alpine-server.log 2>&1 &
          sleep 2

      - name: Capture deterministic iPhone views
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageStat
          from pathlib import Path
          import json
          shots=[
            ('spawn_peak',8500,-13000,3.40,-.025,True),
            ('north',8500,-13000,0.0,-.025,True),
            ('east',8500,-13000,1.57,-.025,True),
            ('south',8500,-13000,3.14,-.025,True),
            ('west',8500,-13000,4.71,-.025,True),
            ('northeast',8500,-13000,.78,-.025,True),
            ('look_up',8500,-13000,3.40,.38,False),
            ('look_down',8500,-13000,3.40,-.38,False),
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True)
          metrics=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox'])
            page=browser.new_page(viewport={'width':932,'height':430})
            for name,x,z,yaw,pitch,normal in shots:
              page.goto(f'http://127.0.0.1:8000/index.html?qa=1&x={x}&z={z}&yaw={yaw}&pitch={pitch}',wait_until='load',timeout=30000)
              page.wait_for_timeout(1800)
              if not page.evaluate("!!document.querySelector('#game').getContext('webgl2')"):
                  raise RuntimeError('WebGL2 unavailable')
              target=out/f'{name}.png'; page.screenshot(path=str(target))
              im=Image.open(target).convert('L'); hist=im.histogram(); total=sum(hist)
              mean=ImageStat.Stat(im).mean[0]; black=sum(hist[:18])/total; lo,hi=im.getextrema()
              center_top=im.crop((int(im.width*.2),0,int(im.width*.8),int(im.height*.13)))
              top_std=ImageStat.Stat(center_top).stddev[0]
              row={'name':name,'mean':mean,'black':black,'range':hi-lo,'top_std':top_std,'normal':normal}
              metrics.append(row)
              print(name,'mean',round(mean,1),'black',round(black,4),'range',hi-lo,'center_top_std',round(top_std,1))
            browser.close()
          Path('qa-metrics.json').write_text(json.dumps(metrics,indent=2))
          PY

      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: alpine-visual-qa-deterministic-terrain
          path: |
            qa-shots/*.png
            qa-metrics.json
          if-no-files-found: error

      - name: Evaluate basic guardrails
        run: |
          python - <<'PY'
          import json
          m=json.load(open('qa-metrics.json'))
          bad=[x for x in m if x['mean']<45 or x['black']>.08 or x['range']<60]
          if bad: raise SystemExit('Basic visual guardrail failed: '+repr(bad))
          PY

      - name: Commit candidate to QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No QA code changes"
          else
            git commit -m "QA: deterministic CPU-GPU terrain hash"
            git pull --rebase origin qa
            git push origin HEAD:qa
          fi
