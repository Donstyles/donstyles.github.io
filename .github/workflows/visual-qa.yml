name: Alpine Visual QA

on:
  push:
    branches: [qa]

permissions:
  contents: write

jobs:
  visual-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build QA candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing patch target: {label}')
              s=s.replace(old,new)

          rep(
          "function terrainHeight(x,z){ let amp=1, freq=0.00072, sum=0, norm=0; for(let i=0;i<5;i++){ const n=noise2(x*freq,z*freq); const ridge=1-Math.abs(n*2-1); sum += ridge*ridge*amp; norm += amp; amp*=0.52; freq*=2.03; } const basin=noise2(x*0.00027+53,z*0.00027-19); const detail=noise2(x*0.0042-7,z*0.0042+13); return 180 + (sum/norm)*1500 + basin*650 + detail*18; }",
          "function terrainHeight(x,z){ const macro=noise2(x*0.00012+11,z*0.00012-7); const r0=1-Math.abs(noise2(x*0.00028-21,z*0.00028+31)*2-1); const r1=1-Math.abs(noise2(x*0.00055+47,z*0.00055-13)*2-1); const shoulder=noise2(x*0.00110-5,z*0.00110+17); const detail=noise2(x*0.0028+9,z*0.0028-29); const mountains=Math.pow(r0,2.7)*(1050+1050*macro)+Math.pow(r1,3.0)*360; return 430+macro*300+mountains+shoulder*110+detail*18; }",
          'JS terrain')

          rep(
          "float terrain(vec2 p){ float amp=1.0,freq=.00072,sum=0.0,norm=0.0; for(int i=0;i<5;i++){ float n=noise21(p*freq); float r=1.0-abs(n*2.0-1.0); sum+=r*r*amp; norm+=amp; amp*=.52; freq*=2.03; } float basin=noise21(p*.00027+vec2(53,-19)); float detail=noise21(p*.0042+vec2(-7,13)); return 180.0+(sum/norm)*1500.0+basin*650.0+detail*18.0; }",
          "float terrain(vec2 p){ float macro=noise21(p*.00012+vec2(11,-7)); float r0=1.0-abs(noise21(p*.00028+vec2(-21,31))*2.0-1.0); float r1=1.0-abs(noise21(p*.00055+vec2(47,-13))*2.0-1.0); float shoulder=noise21(p*.00110+vec2(-5,17)); float detail=noise21(p*.0028+vec2(9,-29)); float mountains=pow(r0,2.7)*(1050.0+1050.0*macro)+pow(r1,3.0)*360.0; return 430.0+macro*300.0+mountains+shoulder*110.0+detail*18.0; }",
          'GLSL terrain')

          rep("aGrid*vec2(1850.0)","aGrid*vec2(4300.0)",'terrain draw distance')
          rep("vDist/660.0","vDist/1600.0",'terrain fog depth')
          rep("vec3 fogCol=vec3(.245,.268,.255)","vec3 fogCol=vec3(.300,.320,.306)",'terrain fog color')
          rep("vUv=vec2(aCorner.x+.5,aCorner.y+.5)","vUv=vec2(aCorner.x+.5,1.0-(aCorner.y+.5))",'tree UV orientation')
          rep("vDist/540.0","vDist/900.0",'tree fog depth')
          rep("col=mix(col,vec3(.185,.210,.200)","col=mix(col,vec3(.300,.320,.306)",'tree fog color')
          rep("const cell=28, r=760","const cell=34, r=1050",'forest spacing')
          rep("if(forest>.22 && localSlope<16 && alpine>0){ const s=(6.5+hash2(gx+7,gz+11)*8.5)","if(forest>.42 && localSlope<16 && alpine>0){ const s=(5.2+hash2(gx+7,gz+11)*6.8)",'forest density/size')
          rep("let pos={x:178,z:-612}, yaw=2.34,pitch=-.055","let pos={x:0,z:0}, yaw=5.323,pitch=-.04",'valley spawn')

          # QA mode must be deterministic and UI-clean.
          s=s.replace("if(qaParams.has('test')||qaParams.has('qa')){document.getElementById('start').style.display='none';started=true;}",
                      "if(qaParams.has('test')||qaParams.has('qa')){document.getElementById('start').style.display='none';document.getElementById('hint').style.opacity='0';started=true;}")

          p.write_text(s)
          PY

      - name: Install Playwright
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start local server
        run: |
          python -m http.server 8000 > /tmp/alpine-server.log 2>&1 &
          sleep 2

      - name: Capture six gameplay views
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageStat
          from pathlib import Path

          shots=[
            ('spawn_peak',0,0,5.323,-0.04),
            ('spawn_southwest',0,0,3.58,-0.03),
            ('open_valley',0,0,0.35,-0.02),
            ('forest_edge',900,-350,5.0,-0.04),
            ('high_pass',-1700,-2200,2.25,-0.08),
            ('pitch_stress',0,0,5.323,0.42),
          ]
          out=Path('qa-shots'); out.mkdir(exist_ok=True)
          metrics=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=[
              '--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader',
              '--enable-unsafe-swiftshader','--disable-gpu-sandbox'
            ])
            page=browser.new_page(viewport={'width':1536,'height':709})
            for name,x,z,yaw,pitch in shots:
              url=f'http://127.0.0.1:8000/index.html?qa=1&x={x}&z={z}&yaw={yaw}&pitch={pitch}'
              page.goto(url,wait_until='load',timeout=30000)
              page.wait_for_timeout(1800)
              if not page.evaluate("!!document.querySelector('#game').getContext('webgl2')"):
                raise RuntimeError('WebGL2 unavailable in QA runner')
              target=out/f'{name}.png'
              page.screenshot(path=str(target))
              im=Image.open(target).convert('L')
              st=ImageStat.Stat(im)
              hist=im.histogram(); total=sum(hist)
              dark=sum(hist[:18])/total
              mean=st.mean[0]
              metrics.append((name,mean,dark,im.getextrema()))
              print(name,'mean_luma',round(mean,1),'near_black',round(dark,4),'range',im.getextrema())
            browser.close()

          # Guardrail only: mood can be dark, but an unreadably crushed frame is a failure.
          bad=[m for m in metrics if m[1] < 38 or m[2] > .38]
          if bad:
            raise SystemExit('Visual readability guardrail failed: '+repr(bad))
          PY

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-visual-qa-pass2
          path: qa-shots/*.png
          if-no-files-found: error

      - name: Commit candidate to QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No QA code changes"
          else
            git commit -m "QA2: alpine terrain, upright trees, cleaner vistas"
            git pull --rebase origin qa
            git push origin HEAD:qa
          fi
